[project]
name = "ppt-templates"
version = "0.1.0"
description = "页粒度的 PPT 模板库与声明式渲染器"
requires-python = ">=3.13"
dependencies = ["python-pptx", "pyyaml", "jsonschema", "pypdfium2"]

[project.scripts]
ppt = "ppt_templates.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
