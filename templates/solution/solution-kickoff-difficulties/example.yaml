difficulties:
- name: 难题名称写要攻克的技术问题
  size: 5
  points:
  - {name: 难点, text: 写清约束条件、现有做法为什么不行，点出最关键的矛盾在哪里}
  - {name: 方法名一, text: 写清对什么对象用什么方法，对应架构图里编号相同的分区}
  - {name: 方法名二, text: 写清数据从哪里来、怎样在线校准，结论怎样验证，对应架构图里的哪个节点，, highlight: 关键突破写这里，蓝色加粗}
- name: 难题名称写第二个技术问题
  size: 4
  points:
  - {name: 难点, text: 写清这一环节的约束条件，以及现有做法为什么在这里行不通}
  - {name: 方法名, text: 写清触发时机、判定依据和选择对象的规则，以及怎样避免误判、抖动等副作用，, highlight: 关键突破写这里，蓝色加粗}
- name: 难题名称写第三个技术问题
  size: 4
  points:
  - {name: 难点, text: 写清执行落在哪一层、对业务有什么约束，比如不能卡顿或掉帧}
  - {name: 方法名, text: 写清执行动作作用于什么对象、怎样做到对业务透明，以及效果怎样反馈形成闭环，, highlight: 关键突破写这里，蓝色加粗}
milestones:
- {date: YYYY.MM.DD, deliverable: 交付件写原型或特性等可验收产物}
- {date: YYYY.MM.DD, deliverable: 交付件写特性合入的版本和范围}
