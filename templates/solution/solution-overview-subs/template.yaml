id: solution.solution-overview-subs
name: 大方案+子方案网格
roles: [solution, feature]
also_fits: [system, hardware]
density: talk
level: system
tags: [大方案, 子方案, 关键技术, 指标, 图文]
when_to_use: 一页讲清大方案的构成：顶部并排对比两种大方案的形式（名称＋形式图），下方三到四个子方案各讲名称、特征优势、图示和关键指标收益
when_not_to_use: 只讲一个整体架构、不拆子方案 → solution.solution-arch-overview；子方案要讲处理流程 → solution.solution-module-flow；问题和方案要一一对照 → solution.solution-dual-metrics
frame: standard

structure:
  - 标题：结论式一句话（可带编号前缀），点出大方案要突破的工程技术难题清单——对象加量化难题
  - 顶部两个大方案并排：每个是居中加粗的方案名标签加一张整体方案图（图片位），两个并列对比两种大方案的形态
  - 子方案带：一条细线外框把三到四个子方案的标题和要点区圈成一组、列间竖线分隔，表示它们共同支撑上方的大方案
  - 每个子方案占一列，自上而下：编号＋方案名（关键指标做红色加粗前缀）→ 两三条特征／优势要点（✓ 开头，红色关键数字接黑色说明，整行加粗）→ 深灰底红字的图示名条（点明下面这张图画的是什么）→ 子方案示意图（图片位）→ 浅灰底黑字的关键指标条（量化收益，前后对比）
  - 关系：上半页讲大方案是什么形式，下半页讲靠哪些子方案突破难题；每列内部从名称到指标是「是什么 → 有何特点 → 长什么样 → 收益多少」的递进

slots:
  type: object
  required: [title, title_suffix, big_solutions, subs]
  properties:
    title:
      type: string
      maxLength: 8
      description: 标题主体的编号前缀（24 号加粗、深红），带全角冒号；不超过 6 个字
    title_suffix:
      type: string
      maxLength: 44
      description: 与标题同一行的后半句（18 号加粗、深红）：结论句，写清大方案要突破哪些工程技术难题（对象＋量化指标）；中文不超过 40 个字（英文、数字约半个字宽）
    big_solutions:
      type: array
      minItems: 2
      maxItems: 2
      description: 顶部并排的两个大方案，各配一张形式图，左右对比两种形式
      items:
        type: object
        required: [name]
        properties:
          name: { type: string, maxLength: 16, description: 大方案名称标签（14 号加粗、居中），可带括号注释 }
          image: { type: string, description: 大方案整体图的路径（架构 / 剖面示意），没有就不填，显示占位框 }
    subs:
      type: array
      minItems: 3
      maxItems: 4
      description: 为支撑大方案要突破的子方案，从左到右每列一个
      items:
        type: object
        required: [name, features, figure, metric]
        properties:
          spec: { type: string, maxLength: 10, description: 方案名前的关键指标（14 号加粗、深红），如功耗 / 电流 / 速率等级；没有就不填 }
          name: { type: string, maxLength: 10, description: 子方案名（14 号加粗、黑色，接在关键指标后）；编号自动生成，编号＋指标＋名称一行放下 }
          features:
            type: array
            minItems: 2
            maxItems: 3
            description: 特征 / 优势要点（✓ 开头、14 号加粗），每条一行写完
            items:
              type: object
              required: [text]
              properties:
                spec: { type: string, maxLength: 10, description: 要点开头的关键数字（深红加粗）；没有就不填 }
                text: { type: string, maxLength: 16, description: 要点说明（黑色加粗，接在关键数字后）；数字＋说明合计不超过 13 个字 }
          figure: { type: string, maxLength: 13, description: 图示名（深灰条上 14 号加粗、深红、一行），点明下面的图示画的是什么 }
          image: { type: string, description: 子方案示意图的路径，没有就不填，显示占位框 }
          metric: { type: string, maxLength: 24, description: 关键指标 / 收益（浅灰条上 14 号加粗、黑色）：量化前后对比，一行写完、最长两行 }
          width: { type: number, minimum: 0.7, maximum: 1.3, description: 这一列的相对宽度，默认 1；要点多的列设宽一点（如 1.1），要点少的设窄一点（如 0.8） }

layout:                         # 参考 body 区 1216×560（本页无 takeaway，正文区自动上移并纵向拉伸到 600）
  # 顶部：两个大方案并排，名称标签居中在形式图上方
  - type: grid
    box: [118, 0, 980, 204]
    bind: big_solutions
    columns: 2
    gap: 64
    item:
      - { type: text, box: [0, 0, "100%", 24], bind: name, style: emphasis, align: center, valign: bottom }
      - { type: image, box: [0, 30, "100%", 174], bind: image, placeholder: 大方案整体图（架构 / 剖面示意） }
  # 子方案带：细线外框把各列的标题和要点区圈成一组
  - { type: shape, box: [0, 222, 1216, 116], fill: bg, line: line }
  # 每个子方案一列，列宽随 width 分配
  - type: grid
    box: [0, 222, 1216, 338]
    bind: subs
    columns: 4
    gap: 8
    weight: width
    item:
      # 列间分隔竖线（第一列的线与外框左边重合）
      - { type: shape, box: [0, 14, 1.5, 88], fill: line }
      # 编号 + 关键指标 + 方案名
      - type: text
        box: [4, 6, "100%-8", 26]
        style: emphasis
        valign: middle
        runs:
          - { bind: "#" }
          - { value: " " }
          - { bind: spec, color: accent }
          - { bind: name }
      # 特征 / 优势要点：✓ 开头，红色关键数字接黑色说明
      - type: grid
        box: [4, 36, "100%-8", 74]
        bind: features
        columns: 1
        row_height: 24
        item:
          - type: text
            box: [0, 0, "100%", "100%"]
            style: emphasis
            runs:
              - { value: "✓ ", color: accent }
              - { bind: spec, color: accent }
              - { bind: text }
      # 图示名条（深灰底红字）
      - { type: shape, box: [4, 124, "100%-8", 32], fill: muted }
      - { type: text, box: [12, 124, "100%-24", 32], bind: figure, style: emphasis, color: accent, valign: middle }
      # 子方案示意图
      - { type: image, box: [4, 160, "100%-8", 140], bind: image, placeholder: 子方案示意图 }
      # 关键指标条（浅灰底黑字）
      - { type: shape, box: [4, 304, "100%-8", 30], fill: surface }
      - { type: text, box: [8, 300, "100%-16", 34], bind: metric, style: emphasis, valign: middle }

guidance:
  - 先定两个大方案的名称和整体图，再逐个展开下方的子方案；子方案按重要程度或突破难度从左到右排
  - 每条要点只写一个特征或优势，关键数字放进 spec 让它红色突出；要点多的列把 width 调大（如 1.1），少的调小（如 0.8），各行更容易一行写完
  - 图示名点明图画画的是什么部件 / 结构；关键指标条写量化收益（从 X 提升到 Y），数字要能在要点里找到出处
  - 子方案少于四个时各列自动拉宽、占满整行
