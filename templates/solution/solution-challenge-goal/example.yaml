title: 编号前缀：方案名加一句定性概括写清解决什么
title_suffix: 尾句写可检验的量化收益数字
challenge_label: 左栏栏目标题：问题侧
solution_label: 右栏栏目标题：方案侧
challenge_name: 挑战名称：一句话点出症结所在
solution_name: 方案名称：一句话点出方案的核心机制
trend_summary: 写清什么负载在多快上涨、当前到什么量级
trend_points:
  - name: 第一条趋势的名称
    text: 写清什么负载在涨、涨得多快，当前达到什么量级，预计哪一年超过什么阈值、依据是什么口径、数据来源是什么
    highlight: 段尾强调：最关键量化结论
  - name: 第二条趋势的名称
    text: 另一种对象：它的增长有多快、当前量级多大、未来哪年越过什么阈值、由什么业务变化驱动
evidence_image: ""
evidence_table:
  columns: [指标名称（含单位）, 场景一的数值, 场景二的数值]
  widths: [3, 2, 2]
  rows:
    - [另一项指标（含单位）, 数值或幅度, 数值或幅度]
challenge_summary: 核心卡点是什么、对哪项指标代价多大
challenge_points:
  - name: 挑战点一名称
    text: 写清它在什么场景下出现、底层的根因是什么、对关键指标造成多大的影响
    highlight: 段尾强调：这条的量化代价
  - name: 挑战点二名称
    text: 写清它在什么场景下出现、为什么现有做法无法解决、代价由谁承担
    highlight: 段尾强调：这条的量化代价
  - name: 挑战点三名称
    text: 写清它在什么场景下出现、受制于什么资源、对哪项指标造成多大的影响
solution_summary: 一句话写清用什么架构与什么核心机制，把原来的什么方式转变成什么新方式，覆盖哪个层面
key_techs:
  - name: 第一项关键技术的名称
    text: 写清基于什么硬件或软件机制做什么、覆盖哪些对象或哪条链路，比原来的做法好在哪里、好多少，量化到什么精度，支撑哪项挑战的解决、支撑哪项业务的哪项决策
  - name: 第二项关键技术的名称
    text: 写清它利用什么信息或反馈做决策、作用在什么时机，避免了原方式的哪一类代价，对各类负载带来什么效果
    highlight: 段尾强调：这条的关键收益
  - name: 第三项关键技术的名称
    text: 写清它把哪件事提前、推后或者合并，躲开了什么时刻的什么问题，不影响哪一类需求，换来的是哪一项关键指标的多大改善、口径是什么
solution_image: ""
compare_table:
  columns: [对比项名称, 维度一, 维度二, 维度三]
  widths: [2.4, 3, 3, 2.4]
  rows:
    - [原来的方案, 原做法的量化表现, 原做法的量化表现, 原做法]
    - [本方案, 改进后的量化表现, 改进后的量化表现, 改进做法]
goal_text: 写清通过什么关键手段，在什么场景范围内把哪些关键指标做到什么水平、口径是什么
goal_metric: 量化片段：一到两个关键指标与各自对应的目标数值
