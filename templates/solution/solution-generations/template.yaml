id: solution.solution-generations
name: 多代际方案
roles: [solution, roadmap]
density: talk
level: module
tags: [代际, 规划, 架构图]
when_to_use: 讲一条产品 / 技术线的多代际方案：先给多代际的共同目标，再按代际逐列展开各代的目标、架构图与特征、支撑技术
when_not_to_use: 只讲一代方案、没有代际对比 → solution.solution-arch-overview；只按时间线排产品或工作计划、不展开架构图 → product / project 主题的 roadmap 页
frame: standard

structure:
  - 标题：结论式同行标题——主题写对象（可带括号补充），后半句写对各代际的结论；24 号加粗 + 18 号，深红
  - 目标条：左侧窄竖条「目标」标签（灰底、红字、带阴影），右侧浅灰面板（带阴影）里逐条列多代际的共同目标（加粗代际名 + 一句说明）；回答「这几代合起来要达到什么」
  - 代际页签：每个代际一个蓝底白字页签（代际名 + 时间段），比列框略窄、压在列框上沿，标明这一列讲哪一代
  - 代际列：2-4 列并排、结构相同，列内自上而下是目标要点（编号要点：加粗名称 + 说明，说明里的关键指标用蓝色强调）→ 方案区（一到两个方案：浅蓝名称框写加粗方案名 + 蓝色括号补充，框内可带一行红色的量化特征行，框下是可选图注和架构图）→ 关键技术（编号列表，每条一行）
  - 关系：目标条是各代际的共同目标，下面每列展开一代、从左到右按时间先后排列；列内是「要达到什么 → 方案长什么样、有什么特征 → 靠什么技术实现」的递进

slots:
  type: object
  required: [title, title_suffix, goals, generations]
  properties:
    title:
      type: string
      maxLength: 14
      description: 标题主体（24 号加粗）：对象名称，可带括号补充
    title_suffix:
      type: string
      maxLength: 54
      description: 与标题同一行的后半句（18 号）：对各代际的结论，一句写完；标题与后半句合计不超过一行（约 37 个汉字当量）
    goals:
      type: array
      minItems: 2
      maxItems: 3
      description: 多代际的共同目标，每条「代际名：一句说明」
      items:
        type: object
        required: [name, text]
        properties:
          name: { type: string, maxLength: 10, description: 目标针对的代际或产品名，加粗 }
          text: { type: string, maxLength: 76, description: 一句说明：突破什么、做到什么指标、带来什么收益，最多两行 }
    generations:
      type: array
      minItems: 2
      maxItems: 4
      description: 各代际，从左到右按时间先后排列
      items:
        type: object
        required: [tab, objectives, schemes, key_techs]
        properties:
          tab:
            type: string
            maxLength: 24
            description: 代际页签：代际名 + 时间段，一行写完
          objectives:
            type: array
            minItems: 1
            maxItems: 2
            description: 这一代的目标要点，编号自动，每条「名称：说明」、最多两行
            items:
              type: object
              required: [name, text]
              properties:
                name: { type: string, maxLength: 12, description: 目标名称（短语），加粗 }
                text: { type: string, maxLength: 44, description: 说明：突破什么、支撑什么、量化收益 }
                highlight: { type: string, maxLength: 20, description: 说明里的蓝色强调片段（关键指标），可选 }
                text2: { type: string, maxLength: 26, description: 蓝色片段之后的说明余文，可选 }
          schemes:
            type: array
            minItems: 1
            maxItems: 2
            description: 这一代的方案，一到两个，上下排列
            items:
              type: object
              required: [name, diagram]
              properties:
                name: { type: string, maxLength: 14, description: 方案名称（短语），加粗，一行写完 }
                note: { type: string, maxLength: 10, description: 名称后的蓝色括号补充（连括号一起写），可选 }
                feature: { type: string, maxLength: 24, description: 名称框内的特征行：红色量化收益一行，如距离 / 成本 / 功耗，可选 }
                caption: { type: string, maxLength: 22, description: 架构图上方的图注（方案形态等一句话），可选 }
                diagram: { type: string, description: 架构图（模块 / 链路框图）的图片路径 }
          key_techs:
            type: array
            minItems: 1
            maxItems: 2
            description: 支撑这一代方案的关键技术，编号自动，每条一行写完
            items:
              type: object
              required: [name, text]
              properties:
                name: { type: string, maxLength: 8, description: 技术名称（短语），加粗 }
                text: { type: string, maxLength: 22, description: 做什么、带来什么效果 }
                highlight: { type: string, maxLength: 14, description: 句中的蓝色强调片段，可选 }
                text2: { type: string, maxLength: 8, description: 蓝色片段之后的余文，可选 }
      allOf:
        - if: { minItems: 4 }
          then:
            items:
              properties:
                tab: { maxLength: 16, description: 代际页签：代际名 + 时间段（四个代际时页签更窄，一行写完） }

layout:                         # 参考 body_compact 区 1216×560（无 takeaway，渲染时纵向拉伸到 600）
  # 顶部目标条：左「目标」竖条 + 右侧浅灰面板
  - { type: shape, box: [4, 0, 42, 116], fill: surface, line: surface, shadow: true }
  - { type: text, box: [4, 0, 42, 116], value: "目\n标", style: emphasis, color: accent, align: center, valign: middle }
  - { type: shape, box: [54, 0, 1162, 116], fill: surface_light, shadow: true }
  - { type: bullets, box: [70, 4, 1132, 108], bind: goals, style: lead }

  # 代际列（2-4 列）：页签压在列框上沿；列内自上而下 = 目标描述 → 方案区 → 关键技术
  - type: grid
    box: [0, 124, 1216, 436]
    bind: generations
    columns: 4
    gap: 16
    item:
      # 列框：白底细描边、无阴影
      - { type: shape, box: [0, 16, "100%", 420], fill: bg, line: line }
      # 代际页签：蓝底白字，比列框略窄、水平居中，压在列框上沿（后画，盖在列框上）
      - { type: shape, box: ["6%", 0, "88%", 32], fill: primary, shadow: true }
      - { type: text, box: ["6%", 0, "88%", 32], bind: tab, style: emphasis, color: on_primary, align: center, valign: middle }
      # 目标描述：编号要点（名称加粗；highlight / text2 表达句中蓝色强调）
      - type: grid
        box: [6, 34, "100%-12", 88]
        bind: objectives
        columns: 1
        row_height: 44
        item:
          - type: text
            box: [0, 0, "100%", 44]
            style: body
            runs:
              - { bind: "#", style: body_strong }
              - { value: "）", style: body_strong }
              - { bind: name, style: body_strong }
              - { value: "：", style: body_strong }
              - { bind: text }
              - { bind: highlight, color: primary_text }
              - { bind: text2 }
      # 方案区：一到两个方案，等分高度
      - type: grid
        box: [10, 130, "100%-20", 218]
        bind: schemes
        columns: 1
        item:
          - { type: shape, box: ["4%", 0, "92%", 48], fill: highlight_blue, line: surface, shadow: true }
          - type: text
            box: ["6%", 2, "88%", 24]
            style: lead
            align: center
            runs:
              - { bind: name, style: emphasis }
              - { bind: note, color: primary_text }
          - { type: text, box: ["6%", 26, "88%", 20], bind: feature, style: lead, color: accent, align: center, when: feature }
          - { type: text, box: ["4%", 50, "92%", 22], bind: caption, style: lead, align: center, when: caption }
          - { type: image, box: ["6%", 74, "88%", "100%-76"], bind: diagram, placeholder: 放这一代方案的架构图 }
      # 关键技术：编号列表，每条一行
      - { type: text, box: [10, 354, 200, 22], value: 关键技术：, style: emphasis }
      - type: grid
        box: [10, 380, "100%-20", 44]
        bind: key_techs
        columns: 1
        row_height: 22
        item:
          - type: text
            box: [0, 0, "100%", 22]
            style: body
            runs:
              - { bind: "#", style: body_strong }
              - { value: "、", style: body_strong }
              - { bind: name, style: body_strong }
              - { value: "：", style: body }
              - { bind: text }
              - { bind: highlight, color: primary_text }
              - { bind: text2 }

guidance:
  - 代际从左到右按时间先后排；页签写清代际名和时间段，一代一列
  - 目标条写几代共同要达到什么；每列的目标要点是这一代自己的具体目标，每条最多两行，关键指标用 highlight 写成蓝色
  - 方案名称框一行写完；feature 写量化收益（距离、成本、功耗），caption 写方案形态；diagram 放这一代的模块 / 链路架构图
  - 关键技术每条一行写完，和架构图里的模块对应
  - 两个方案时架构图较矮，图要简单；四个代际时每列更窄，页签和名称都要更短
