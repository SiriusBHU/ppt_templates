title: 标题主体点明对象和方案名：
title_suffix: 后半句写清核心技术路线以及最突出的量化目标收益
banner_label: 技术目标
banner_text: 目标栏写清面向哪类问题现状、走哪条技术路线、把哪一项能力量化做到什么程度；进展栏则分条写各方向分别完成了什么、进度百分比多少、下一步做什么，连同标签两行以内写完
problems:
  - name: 问题
    text: 1) 症结一：写清对象是什么、现状如何、代价有多大，为什么现有做法做不到位；2) 症结二：写清矛盾双方各自的要求是什么、量化差距有多大；3) 症结三：写清过程对人工或资源的依赖程度
    highlight: 关键结论写这里
  - name: 挑战
    text: 1) 写清要建成什么能力、量化做到什么精度；2) 写清过程中最难的一两步分别卡在哪里、为什么绕不开；3) 写清结果要支撑哪项决策、和谁对齐口径
  - name: 目标
    text: 写清量化目标：什么指标做到多少、覆盖哪些场景、带来多大收益
problem_images: ["", ""]
solutions:
  - name: 1. 方案一名称写基于什么做什么
    points:
      - { name: 要点名一, text: 写清作用对象是什么、用什么方法手段处理哪一部分、量化做到什么精度, highlight: 关键结论写这里 }
      - { name: 要点名二, text: 写清数据或信息从哪里来、怎么对齐，结论怎么验证、和什么基线比较 }
  - name: 2. 方案二名称写对什么做什么
    points:
      - { name: 要点名一, text: 写清建模或分析的对象和边界、采用什么方法，输出什么指标或结论 }
      - { name: 要点名二, text: 写清做到什么精度或覆盖率、在哪些场景验证过，支撑哪项决策, highlight: 收益数字写这里 }
  - name: 3. 方案三名称写流程怎么串起来
    points:
      - { name: 要点名一, text: 写清流程各环节分别做什么、输出什么，环节之间怎么衔接 }
      - { name: 要点名二, text: 写清适用范围和边界条件，不适用时退化成什么做法 }
solution_images: ["", ""]
