id: solution.solution-arch-overview
name: 分区架构方案总览
roles: [solution, feature]
also_fits: [system, software, hardware]
density: talk
level: system
tags: [架构, 分区, 方案, 挑战, 关键技术]
when_to_use: 用一页讲清系统方案的全貌：面临的核心挑战、设计理念、分区分层的整体架构，以及支撑它的关键技术
when_not_to_use: 只有一张数据流框图、不分区 → solution.solution-block-diagram；只讲软件模块之间的处理流程 → solution.solution-module-flow；只讲瓶颈、不讲方案 → system.problem-bottleneck
frame: standard

slots:
  type: object
  required: [title, takeaway, challenges, principles, arch, key_techs]
  properties:
    title:
      type: string
      maxLength: 14
      description: 标题主体（24 号加粗），说明这是什么方案
    title_suffix:
      type: string
      maxLength: 16
      description: 与标题同一行的后半句（18 号），补充方案要点
    takeaway:
      type: string
      maxLength: 40
      description: 目标横幅（18 号，一行），一句话写清方案要支撑什么、达到什么量化收益
    challenges:
      type: array
      minItems: 2
      maxItems: 3
      description: 核心挑战，每条「名称：说明」连排成一行，一行写完
      items:
        type: object
        required: [name, detail]
        properties:
          name: { type: string, maxLength: 8, description: 挑战名称（短语），加粗 }
          detail: { type: string, maxLength: 26, description: 现象 + 量化影响 }
    principles:
      type: array
      minItems: 2
      maxItems: 3
      description: 架构理念，每条「名称：说明」连排成一行，一行写完
      items:
        type: object
        required: [name, detail]
        properties:
          name: { type: string, maxLength: 8, description: 理念名称（短语），加粗 }
          detail: { type: string, maxLength: 18, description: 这条理念怎么做、回应哪个挑战 }
    arch:
      type: object
      required: [partitions]
      description: 分区架构图：几个并排的分区，各自分层；共享层横跨所有分区
      properties:
        partitions:
          type: array
          minItems: 2
          maxItems: 3
          description: 从左到右的分区，宽度随该分区每层最多的模块数分配
          items:
            type: object
            required: [name, layers]
            properties:
              name: { type: string, maxLength: 26, description: 分区页签，可带英文，如 Agent Reasoning (via NPU) }
              layers:
                type: array
                minItems: 1
                maxItems: 4
                description: 从上到下的各层
                items:
                  type: object
                  required: [name, modules]
                  properties:
                    name: { type: string, maxLength: 6 }
                    modules:
                      type: array
                      minItems: 1
                      maxItems: 4
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: { type: string, maxLength: 8 }
                          highlight:
                            type: boolean
                            default: false
                            description: 本次新增或改动的模块设为 true
        shared:
          type: array
          maxItems: 2
          description: 横跨所有分区、画在分区下方的共享层，如统一内存池、高速互联
          items:
            type: object
            required: [name, modules]
            properties:
              name: { type: string, maxLength: 6 }
              modules:
                type: array
                minItems: 1
                maxItems: 6
                items:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 10 }
                    highlight:
                      type: boolean
                      default: false
                      description: 本次新增或改动的模块设为 true
    key_techs:
      type: array
      minItems: 3
      maxItems: 4
      description: 关键技术，按重要程度从上到下编号
      items:
        type: object
        required: [name, points]
        properties:
          name: { type: string, maxLength: 14, description: 技术名称（短语），红色加粗 }
          points:
            type: array
            minItems: 1
            maxItems: 2
            description: 要点，每条一行写完：怎么做、带来什么效果
            items: { type: string, maxLength: 27 }

layout:                         # 参考 body 区 1216×560；卡片之间、卡片内边距都是 16
  # 第一行左：核心挑战（白色卡片）
  - { type: shape, box: [0, 0, 664, 92], fill: bg, shadow: true }
  - { type: text, box: [16, 0, 44, 92], value: "核心\n挑战", style: emphasis, color: accent, align: center, valign: middle }
  - type: grid
    box: [76, 8, 572, 76]
    bind: challenges
    columns: 1
    item:                       # 不设 row_height：条目均分 box 高度，文字垂直居中
      - type: text
        box: [0, 0, "100%", "100%"]
        style: body
        valign: middle
        runs:
          - { bind: name, style: body_strong }
          - { value: "：", style: body_strong }
          - { bind: detail }

  # 第一行右：架构理念
  - { type: shape, box: [680, 0, 536, 92], fill: bg, shadow: true }
  - { type: text, box: [696, 0, 44, 92], value: "架构\n理念", style: emphasis, color: accent, align: center, valign: middle }
  - type: grid
    box: [756, 8, 444, 76]
    bind: principles
    columns: 1
    item:
      - type: text
        box: [0, 0, "100%", "100%"]
        style: body
        valign: middle
        runs:
          - { bind: name, style: body_strong }
          - { value: "：", style: body_strong }
          - { bind: detail }

  # 第二行左：分区架构图（底部 28px 是图例，所以图的下沿 = 右侧卡片的下沿 532）
  - type: component
    component: partitioned-arch
    box: [0, 108, 664, 452]
    bind: arch
    props: { legend: 本次新增 / 改动 }

  # 第二行右：关键技术
  - { type: shape, box: [680, 108, 536, 424], fill: bg, shadow: true }
  - { type: text, box: [696, 124, 504, 24], value: 关键技术, style: emphasis, color: accent, valign: middle }
  - type: grid
    box: [696, 156, 504, 360]
    bind: key_techs
    columns: 1
    item:                       # 不设 row_height：条目均分高度；每项的内容块（名称 + 要点）在格子里垂直居中
      - { type: shape, box: [0, "50%-36", 28, 28], fill: accent, shape: oval }
      - { type: text, box: [0, "50%-36", 28, 28], bind: "#", style: body_strong, color: on_primary, align: center, valign: middle }
      - { type: text, box: [40, "50%-36", "100%-40", 28], bind: name, style: emphasis, color: accent, valign: middle }
      - { type: bullets, box: [40, "50%-6", "100%-40", 42], bind: points, style: body }

guidance:
  - takeaway 是整页的目标：先写要支撑什么场景，再写量化收益，收益数字要在关键技术里有出处
  - 挑战、理念、关键技术三者对应：每条理念回应至少一条挑战，每项关键技术落在架构图的某个模块上
  - 架构图的分区按「谁干什么活」切（如 CPU 做工具调用、NPU 做推理），不是按软硬件切；跨分区共用的资源放进共享层
  - 只把本次真正新增或改动的模块设为 highlight，一般不超过 4 个，并让它们和关键技术一一对上
