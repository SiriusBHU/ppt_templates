techs:
- name: 1. 关键技术一写基于什么做什么
  points:
  - {name: 要点名一, text: 写清作用对象、使用的方法和对应的架构节点，说明怎样解决左侧的问题}
  - {name: 要点名二, text: 写清数据从哪里来、怎样校准，结论如何验证, highlight: 关键结论写这里}
- name: 2. 关键技术二写何时做、对谁做
  points:
  - {name: 要点名一, text: 写清触发时机和判定依据，与现有做法相比改变了什么}
  - {name: 要点名二, text: 写清选择对象的规则，以及怎样避免误判和副作用, highlight: 收益数字写这里}
- name: 3. 关键技术三写执行与闭环
  points:
  - {name: 要点名一, text: 写清执行动作落在哪一层、作用于什么对象，怎样保证业务无感}
  - {name: 要点名二, text: 写清直接收益和间接收益分别是什么，用什么指标衡量, highlight: 体验收益写这里}
