title: 标题写清这是什么方案：
title_suffix: 后半句写清核心技术路线、突破了什么瓶颈、带来多大的总体收益
challenges_label: 挑战标签
challenges:
  - name: 第一个挑战名称
    aspect: 挑战所在具体方面
    text: 常规部分：在什么场景下出现、现象是什么，
    key: 关键数字与结论：量化代价有多大
  - name: 第二个挑战名称
    aspect: 挑战所在具体方面
    text: 常规部分：现象是什么、由什么引起，
    key: 关键数字与结论：和目标差距多少
  - name: 第三个挑战名称
    aspect: 挑战所在具体方面
    text: 常规部分：在什么场景下出现，
    key: 关键数字与结论：代价有多大、为什么撑不住
solutions:
  - name: 第一个技术方案的名称
    metrics:
      columns: [对比项, 口径一, 口径二, 口径三, 口径四]
      widths: [2.6, 1.2, 1.2, 1.4, 1.4]
      rows:
        - [方案或档位名称, 结果数值, 结果数值, 结果数值, 结果数值]
        - [方案或档位名称, 结果数值, 结果数值, 结果数值, 结果数值]
        - [方案或档位名称, 结果数值, 结果数值, 结果数值, 结果数值]
    points:
      - { name: 特征要点一名称, text: 做法写在这里：用什么手段处理哪一部分、怎么做、适用于什么场景，换来了什么效果，, highlight: 带来的关键收益 }
      - { name: 特征要点二名称, text: 做法写在这里：跳过或合并了哪些工作，让开销不再随什么增长，, highlight: 省下多少开销 }
      - { name: 特征要点三名称, text: 做法写在这里：作用在多细的粒度上、兼顾了哪几类对象各自的诉求、还支撑哪种分层 }
  - name: 第二个技术方案的名称
    metrics:
      columns: [档位, 成本, 场景一, 场景二, 场景三]
      widths: [2.4, 1.4, 1.5, 1.7, 1.7]
      rows:
        - [档位名称, 归一数值, 归一数值, 归一数值, 归一数值]
        - [档位名称, 归一数值, 归一数值, 归一数值, 归一数值]
        - [档位名称, 归一数值, 归一数值, 归一数值, 归一数值]
        - [档位名称, 归一数值, 归一数值, 归一数值, 归一数值]
    note: 注：数值的假设、测试口径与适用范围写在这里，一行写完；没有就不填
    points:
      - { name: 特征要点一名称, text: 做法写在这里：把哪两件事合在一起做，消掉了哪一段开销，, highlight: 带来的关键收益 }
      - { name: 特征要点二名称, text: 做法写在这里：换成什么机制来管理，哪类对象之间不再互相干扰，, highlight: 带来的关键收益 }
      - { name: 特征要点三名称, text: 做法写在这里：按什么维度分档组合，怎么感知热度并按层放置，, highlight: 整体收益是多少 }
