title: 对象创新(N)：一句话方案名
title_suffix: 后半句：减少什么开销、缓解什么争抢，提升什么指标
problems_label: 核心问题
problems:
  - 问题链一（A 加剧 B）：说明在什么场景下，谁和谁并发使能、两路数据并发读写哪类资源，最终加剧了什么资源的争抢
  - 问题链二（B 导致 C）：争抢之后哪两类操作互相影响，对哪类指标的抖动有多大、最终代价有多严重
background: 一句话问题背景：什么场景，谁和谁抢占什么资源
problem_image: ""
challenge: 机制 + 量化影响：问题如何发生，哪类操作指标变化多少、另一类变化多少
metrics_image: ""
goals_label: 竞争力目标
goals:
  - 目标一：说明在什么场景下，哪两类流量互不干扰
  - 目标二：对比现有基线，整体吞吐能力提高百分之几
techs_label: 关键技术
key_techs:
  - name: 技术一（短语）
    detail: 一句话怎么做：设计什么样的指令与什么样的传输通路来实现
  - name: 技术二（短语）
    detail: 一句话怎么做：增加什么机制让数据被尽快消费掉
  - name: 技术三（短语）
    detail: 一句话怎么做：基于什么算法调度并分配各级缓存
solution: 一句话总思路：绕过什么，利用什么打通直达通路
techs:
  - name: 技术名称一（基于什么做什么）
    status: 软版本@当代，硬版本@下代
    image: ""
    points:
      - 要点一：怎么使能、依赖什么前置条件与代价
      - 要点二：使能什么传输、对端怎么配合免除什么
  - name: 技术名称二（基于什么的扩展）
    status: 硬版本@下代
    image: ""
    points:
      - 要点一：覆盖近端与远端哪两类存储
      - 要点二：什么机制把写不下的数据转写到哪一级
  - name: 技术名称三（基于什么的管理）
    status: 推动中@未来两代
    image: ""
    points:
      - 单条要点：按类型把各类流量分发到哪级缓存，什么场景下利用率能翻几倍
