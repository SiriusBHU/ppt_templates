title: 推理服务平台量化分析：
title_suffix: 对比四类候选方案在典型负载下的表现，导出规格配置与容量规划结论
demand_title: 平台团队诉求：提前量化回答规格与容量问题，支撑年度规划决策
demands:
  - name: 负载增长快
    tone: warm
    desc: 写清这类诉求关注什么对象和场景、要回答什么问题，以及量化口径，例如峰值并发、时延上限、预算上限等门槛，说明现状差距
  - name: 成本约束紧
    tone: gray
    desc: 说明这类诉求的来源和关注点：谁提出、针对哪类对象、希望量化到什么程度，例如单位成本、资源利用率、能耗上限等关键指标
  - name: 演进节奏快
    tone: cool
    desc: 写清这类诉求要支撑什么决策、覆盖哪些场景，以及评估要跟上多快的变化节奏，例如每季度一次的规划刷新、月度复算等安排
strategy_title: 分析策略：自顶向下拆解对象、逐层量化验证、滚动复验收敛
strategies:
  - name: 基线建模
    text: 说明这一步做什么、用什么方法、产出什么，例如先把现状抽象成基线模型
  - name: 方案推演
    text: 写清如何批量评估候选方案：参数怎么扫、场景怎么选、和谁对比
  - name: 迭代收敛
    text: 说明如何按评估结果调整方案并复验，直到指标达标或方向被证否
banner: 基于统一分析平台贯通诉求与策略，以下按对象分栏给出量化评估结论
results_label: 关键结果
columns:
  - title: 对象一：计算子系统
    blocks:
      - size: 5
        caption: 表题：这组数据评估什么
        data:
          columns: [指标（口径）, 现状, 目标]
          widths: [3, 2, 2]
          rows:
            - [指标名称含单位, 改进前数值, 改进后数值]
            - [指标名称含单位, 改进前数值, 改进后数值]
            - [指标名称含单位, 改进前数值, 改进后数值]
            - [指标名称含单位, 改进前数值, 改进后数值]
      - size: 2
        points:
          - { name: 代号一, text: 写清做了什么分析、得出什么结论，结论中的数字要能在上方表格里找到出处, highlight: 关键数字 }
          - { name: 代号二, text: 第二项工作的结论：方法一句话、结论一句话，数值与表格口径保持一致, highlight: 提升幅度 }
  - title: 对象二：存储子系统
    blocks:
      - size: 5
        caption: 表题：写清评估对象与场景
        data:
          columns: [场景, 基线, 优化后, 收益]
          widths: [2.4, 2, 2, 1.6]
          rows:
            - [场景名称一, 基线数值, 优化后数值, 收益幅度]
            - [场景名称二, 基线数值, 优化后数值, 收益幅度]
            - [场景名称三, 基线数值, 优化后数值, 收益幅度]
            - [场景名称四, 基线数值, 优化后数值, 收益幅度]
            - [场景名称五, 基线数值, 优化后数值, 收益幅度]
      - size: 3
        points:
          - { name: 代号三, text: 这条要点对应表中哪几行：结论先说方向再说幅度，口径与表一致, highlight: 收益数字 }
          - { name: 代号四, text: 写清分析覆盖的范围和边界，哪些场景还没有数据、下一步补什么, highlight: 覆盖范围 }
          - { name: 代号五, text: 结论里被决策引用的部分写在这里，点明支撑哪项决策, highlight: 决策结论 }
  - title: 对象三：网络子系统
    blocks:
      - size: 4
        caption: 表题一：写清评估什么
        data:
          columns: [维度, 方案一, 方案二]
          widths: [2, 2.4, 2.4]
          rows:
            - [维度名称, 方案一数值, 方案二数值]
            - [维度名称, 方案一数值, 方案二数值]
            - [维度名称, 方案一数值, 方案二数值]
      - size: 4
        caption: 表题二：写清评估什么
        data:
          columns: [维度, 方案一, 方案二]
          widths: [2, 2.4, 2.4]
          rows:
            - [维度名称, 方案一数值, 方案二数值]
            - [维度名称, 方案一数值, 方案二数值]
            - [维度名称, 方案一数值, 方案二数值]
      - size: 2
        points:
          - { name: 代号六, text: 两张表各管什么：第一张看能力上限，第二张看开销代价，要点把两者一起总结, highlight: 综合结论 }
          - { name: 代号七, text: 写清结论适用的边界条件和主要风险，避免被误用到别的场景, highlight: 适用边界 }
