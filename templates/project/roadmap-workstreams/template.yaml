id: project.roadmap-workstreams
name: 分层业务规划
roles: [roadmap, overview]
also_fits: [product, system]
density: talk
tags: [业务规划, 分层, 工作项, 接口专家]
when_to_use: 讲一个领域的整体业务规划：按层次（从靠近业务到靠近硬件）把领域拆成几行，每一层并排列出要建设的工作项，每项写清做什么、做到什么程度、支撑什么决策，并标出接口专家
when_not_to_use: 已完成和未完成的里程碑进展 → project.overview-milestones；按时间轴排各条产品线的规划 → product.roadmap-lanes；只有一条线的分阶段演进 → system.roadmap-stages
frame: standard

structure:
  - 标题：这一页规划的主题，名词短语，写「哪个领域 + 哪类业务 + 规划」，不写成结论句
  - 左侧灰色标签列：每行一个层次的名称，给右边这一行的工作项分组；从上到下的顺序就是层次的上下关系（上层靠近业务和负载，下层靠近架构和硬件）
  - 右侧圆角细框卡片：一张卡就是这一层里的一个工作项，框的作用是把这个工作项的名称、说明、接口专家圈成一体；同一行的卡片是并列关系，按重要程度从左到右排
  - 卡片顶部蓝色加粗居中：工作项名称，点出建的是什么（模型、平台、机制）
  - 卡片中部黑色正文：一到三段并列说明，每段一件事，写「针对什么对象、用什么方法 + 做到什么精度或量级 + 支撑导出什么方案或决策」
  - 卡片底部红色加粗居中：「接口专家：姓名、姓名」，这一项对接的专家
  - 行高和卡片宽度跟着内容走：说明多的层设高一些（height），说明多的卡设宽一些（width）

slots:
  type: object
  required: [title, layers]
  properties:
    title:
      type: string
      maxLength: 30
      description: 页标题（24 号加粗、深红、一行）：这一页规划的主题，名词短语，如「某领域某类业务规划」
    layers:
      type: array
      minItems: 2
      maxItems: 4
      description: 从上到下的层次，上层靠近业务和负载，下层靠近架构和硬件
      items:
        type: object
        required: [name, items]
        properties:
          name:
            type: string
            maxLength: 12
            description: 层次名称，写在行首的灰色标签里，一行最多 6 个字；可以用换行（\n）按意思分成两行，如「某某层」换行「工作类型」
          height:
            type: number
            minimum: 1
            maximum: 2
            description: 这一层的相对行高，默认 1；说明写得多（有一张卡写了两三段）的层设 1.5–2
          items:
            type: array
            minItems: 1
            maxItems: 4
            description: 这一层的工作项，从左到右按重要程度排；一层超过 4 项就拆成两层
            items:
              type: object
              required: [name, points, experts]
              properties:
                name: { type: string, maxLength: 16, description: 工作项名称（短语），蓝色加粗居中，一行写完；一层 4 项时中文不超过 12 个字（英文、数字约半个字宽） }
                points:
                  type: array
                  minItems: 1
                  maxItems: 3
                  description: 一到三段并列说明，每段一件事；上限随这一层的项数收紧：1 项 140 字、2 项 100 字、3 项 72 字、4 项 56 字（按三层、行高 1 估算），写两三段或排四层时每段要更短
                  items: { type: string, maxLength: 140 }
                experts: { type: string, maxLength: 16, description: 接口专家姓名，用「、」隔开，不含「接口专家：」前缀；一层 4 项时不超过 9 个字 }
                width: { type: number, minimum: 1, maximum: 2, description: 这张卡的相对宽度，默认 1；说明多的卡设 1.5–2 }
        allOf:                  # 说明的字数上限随这一层的项数收紧（项越多卡越窄）
          - if: { properties: { items: { minItems: 2 } } }
            then: { properties: { items: { items: { properties: { points: { items: { maxLength: 100 } } } } } } }
          - if: { properties: { items: { minItems: 3 } } }
            then: { properties: { items: { items: { properties: { points: { items: { maxLength: 72 } } } } } } }
          - if: { properties: { items: { minItems: 4 } } }
            then: { properties: { items: { items: { properties: { points: { items: { maxLength: 56 } } } } } } }

layout:                         # 参考 body 区 1216×560（本页无 takeaway，正文区自动上移并纵向拉伸到 600）
  - type: grid
    box: [0, 0, 1216, 560]
    bind: layers
    columns: 1
    gap: 24
    weight: height
    item:
      # 行首：灰底带阴影的层次标签，文字居中
      - { type: shape, box: [0, 0, 108, "100%"], fill: surface, shadow: true }
      - { type: text, box: [6, 0, 96, "100%"], bind: name, style: body_strong, align: center, valign: middle }
      # 这一层的工作项：灰色细描边的圆角框，白底无阴影；标题、接口专家居中，说明左对齐
      - type: grid
        box: [124, 0, "100%-124", "100%"]
        bind: items
        columns: 4
        gap: 14
        weight: width
        item:
          - { type: shape, box: [0, 0, "100%", "100%"], shape: rounded, radius: 14, fill: bg, line: line }
          - { type: text, box: [12, 10, "100%-24", 20], bind: name, style: body_strong, color: primary_text, align: center }
          - { type: bullets, box: [12, 36, "100%-24", "100%-68"], bind: points, style: body, marker: false }
          - type: text
            box: [12, "100%-30", "100%-24", 20]
            style: body_strong
            color: accent
            align: center
            runs:
              - { value: "接口专家：" }
              - { bind: experts }

guidance:
  - 标题写这页规划的主题（领域 + 业务 + 规划），结论放到讲稿里或别的页
  - 层次从上到下按「靠近业务 → 靠近硬件」排，层名用同一套说法（如都写「某某层 + 工作类型」）
  - 每段说明一件事：对象和方法、精度或量级、支撑的方案或决策三样都要有；一张卡写两三段时，这张卡设宽一些、这一层设高一些
  - 同一层的工作项并列、互不包含，按重要程度从左到右排
