title: 标题：写明这一页规划的是哪个领域、哪一类业务
layers:
  - name: "第一层的\n层次名称"
    items:
      - name: 工作项名称（点出建的是什么）
        points:
          - 一段话写全三件事：对象和方法（针对哪些对象、用什么手段分析和定位，覆盖哪些场景和业务），做到的程度（准确率、覆盖率或者可降低的量是多少），以及支撑哪项方案或决策落地、最终交付什么、由哪个团队来用
        experts: 专家甲、专家乙、专家丙
  - name: "第二层的\n层次名称"
    height: 1.6
    items:
      - name: 工作项二的名称（短语）
        width: 1.5
        points:
          - 第一段：写一件事，针对什么对象、用什么方法，以及最后做到了什么程度
          - 第二段：写另一件事，建的是什么模型、按什么目标去调，收益有多少
          - 第三段：再写一件事，用到哪些机制和手段，最终改善的是哪一种行为
        experts: 专家甲、专家乙
      - name: 工作项三的名称（短语）
        points:
          - 第一段：写清针对的对象和方法、要识别出来的是哪种影响，做到什么精度
          - 第二段：写清它帮助我们提前发现、提前防住的是哪一类风险，谁来用
        experts: 专家丙、专家丁
      - name: 工作项四的名称（短语）
        points:
          - 第一段：写清模型覆盖的是哪几个维度、用的是什么方法，做到什么精度
          - 第二段：写清它最终支撑的是哪一类决策，给出的又是什么样的结果
        experts: 专家甲、专家乙
      - name: 工作项五的名称（短语）
        points:
          - 第一段：写清针对的是哪一类问题、用的是什么方法，最终做到什么精度
          - 第二段：写清它帮助判断的是哪一类规模上限或者能力边界，谁来使用
        experts: 专家丙、专家丁
  - name: "第三层的\n层次名称"
    height: 1.4
    items:
      - name: 工作项六的名称（短语）
        points:
          - 写清量化的是哪几样东西之间的关系、用的是什么方法、精度能做到多少，以及最终帮助哪一类方案做取舍
        experts: 专家甲、专家乙
      - name: 工作项七的名称（短语）
        points:
          - 写清依据的是哪些特征、搭建的是什么平台、能比较哪几种不同的做法，以及最终给出哪一类最优的方案
        experts: 专家丙
      - name: 工作项八的名称（短语）
        points:
          - 写清覆盖的是哪几类问题、用的是什么方法，以及支撑哪一类规则的制定、上线和落地，最终由谁来使用
        experts: 专家甲、专家乙
      - name: 工作项九的名称（短语）
        points:
          - 写清面向的是哪几类应用或服务、要做哪些分析和推演，以及支撑的是哪项决策、在什么时间点能用上
        experts: 专家丙、专家丁
