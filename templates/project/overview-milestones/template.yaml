id: project.overview-milestones
name: 里程碑进展
roles: [overview]
density: talk
tags: [里程碑, 进展, 时间轴]
when_to_use: 按时间顺序展示项目的关键里程碑和各自的完成状态，并说明当前进展和遇到的问题
when_not_to_use: 展望未来的阶段规划和演进路线 → system.roadmap-stages；列出下一步任务和负责人 → common.next-list
frame: standard

slots:
  type: object
  required: [title, milestones, notes]
  properties:
    title:
      type: string
      maxLength: 14
      description: 标题主体（24 号加粗），说明这是什么项目的进展
    title_suffix:
      type: string
      maxLength: 16
      description: 与标题同一行的后半句（18 号），补充进展要点
    takeaway:
      type: string
      maxLength: 40
      description: 副标题，一句话结论，说明总体进度是否符合计划
    milestones:
      type: array
      minItems: 3
      maxItems: 6
      description: 按时间从左到右排列的里程碑；不足 6 个时自动占满整行
      items:
        type: object
        required: [date, name, status]
        properties:
          date: { type: string, maxLength: 8, description: 时间点，如 2026年9月、10月15日 }
          name: { type: string, maxLength: 16, description: 里程碑名称，写成可检验的交付物 }
          status:
            type: string
            enum: [已完成, 进行中, 未开始]
    notes:
      type: array
      minItems: 1
      maxItems: 3
      description: 当前进展和遇到的问题，每条一句话
      items: { type: string, maxLength: 100 }

layout:                         # 参考 body 区 1216×560
  # 时间轴：节点、卡片顶条和状态标签的颜色随状态变化（已完成 深蓝、进行中 橙色、未开始 灰）
  - { type: shape, box: [0, 38, 1216, 2], fill: line }
  - type: grid
    box: [0, 0, 1216, 320]
    bind: milestones
    columns: 6
    gap: 12
    item:
      - { type: text, box: [0, 0, "100%", 24], bind: date, style: emphasis, color: accent, by: status, color_map: { 已完成: primary_text, 进行中: highlight_strong, 未开始: text } }
      - { type: shape, box: [0, 32, 14, 14], by: status, fill: line, fill_map: { 已完成: primary, 进行中: highlight_strong, 未开始: line } }
      - { type: shape, box: [0, 64, "100%", "100%-64"], fill: surface }
      - { type: shape, box: [0, 64, "100%", 4], by: status, fill: line, fill_map: { 已完成: primary, 进行中: highlight_strong, 未开始: line } }
      - { type: text, box: [12, 84, "100%-24", 56], bind: name, style: emphasis, color: primary_text }
      - { type: shape, box: [12, "100%-60", "100%-24", 1], fill: line }
      - { type: shape, box: [12, "100%-44", 76, 28], shape: rounded, by: status, fill: line, fill_map: { 已完成: primary, 进行中: highlight_strong, 未开始: line } }
      - { type: text, box: [12, "100%-44", 76, 28], bind: status, style: body_strong, color: text, by: status, color_map: { 已完成: on_primary, 进行中: on_primary, 未开始: text }, align: center, valign: middle }

  # 下方：当前进展与问题
  - { type: shape, box: [0, 344, 1216, 216], fill: surface }
  - { type: shape, box: [0, 344, 4, 216], fill: accent }
  - { type: text, box: [24, 360, 1168, 24], value: 当前进展与问题, style: emphasis, color: primary_text }
  - { type: bullets, box: [24, 400, 1168, 148], bind: notes, style: body }

guidance:
  - 里程碑按时间从左到右排列，名称写成可检验的交付物，而不是「推进某某工作」
  - 状态只能是已完成 / 进行中 / 未开始；takeaway 要说明总体进度是否符合计划
  - notes 先写进展，再写问题和需要的支持
