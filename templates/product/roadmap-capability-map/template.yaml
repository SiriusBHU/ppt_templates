id: product.roadmap-capability-map
name: 业务沙盘与关键举措
roles: [roadmap, overview]
also_fits: [system, project]
density: talk
tags: [整体策略, 业务沙盘, 能力地图, 关键举措, 落地节奏]
when_to_use: 讲一块业务的整体策略：左栏把要建设的能力按层次排成一张沙盘（白底近期落地、浅蓝底远期预埋），右栏和左栏的层次一一对应，写每一层的关键举措
when_not_to_use: 按时间轴排各条产品线 → product.roadmap-lanes；每层并排几个工作项、写清指标和接口专家 → project.roadmap-workstreams；客户或场景 × 产品的覆盖矩阵 → product.overview-sandbox
frame: standard

structure:
  - 标题：这一页策略的主题，名词短语，写「面向哪块业务的整体策略」，不写成结论句
  - 左栏（栏目名写在框上方，如「业务沙盘」）：这块业务要建设的全部能力的全景。白底细框里顶部一句总标题，点出这些能力怎么联合成一个整体；下面每个浅灰面板是一个层次的能力分组，组名居中；面板里的小框是一项能力
  - 左栏里的分组框和通栏条目：带标题的白底分组框把同一个子方向的几项能力圈在一起；占满一整行的条目是贯穿这一层的能力
  - 条目底色区分落地节奏：白底是近期要落地的，浅蓝底是远期要预埋的；左下框外的两个小框是这两种底色的图例
  - 右栏（栏目名如「关键举措」）：和左栏的层次一一对应、顺序相同；每层一个小节标题，下面每条「举措名：怎么做 + 产出什么」
  - 右下一句注释：交代左右两栏的口径或分工，例如某类工作归在哪一层
  - 两栏等高并排，左栏是「建什么」，右栏是「怎么建」

slots:
  type: object
  required: [title, map_label, map, actions_label, actions]
  properties:
    title:
      type: string
      maxLength: 30
      description: 页标题（24 号加粗、深红、一行）：这一页策略的主题，名词短语，如「面向某业务的整体策略」
    map_label:
      type: string
      maxLength: 8
      description: 左栏栏目名（18 号加粗，写在框上方居中），一般写「业务沙盘」
    map:
      type: object
      description: 能力沙盘（capability-map 组件）：title 是总标题；groups 是自上而下的层次，每层的 items 是能力，带 items 的条目是分组框，wide 的条目占满一行；tag 取 legend 里的两种落地节奏
    actions_label:
      type: string
      maxLength: 8
      description: 右栏栏目名（18 号加粗，写在框上方居中），一般写「关键举措」
    actions:
      type: array
      minItems: 1
      maxItems: 4
      description: 关键举措的小节，和左栏的层次一一对应、顺序相同；小节标题和举措在右栏里自然往下排，全部举措加起来不超过 12 条
      items:
        type: object
        required: [name, points]
        properties:
          name: { type: string, maxLength: 16, description: 小节标题（14 号加粗，自动接「：」），和左栏对应层的组名一致 }
          points:
            type: array
            minItems: 1
            maxItems: 5
            description: 这一层的举措，每条一件事
            items:
              type: object
              required: [name, text]
              properties:
                name: { type: string, maxLength: 14, description: 举措名（加粗，自动接「：」；中文不超过 10 个字，英文、数字约半个字宽） }
                text: { type: string, maxLength: 48, description: 怎么做 + 产出什么，一到两行 }
    note:
      type: string
      maxLength: 32
      description: 右下一句注释，交代两栏的口径或分工；不需要就不填

layout:                         # 参考 body 区 1216×560（本页无 takeaway，正文区自动上移并纵向拉伸到 600）
  # 两个栏目名，写在各自框的上方居中
  - { type: text, box: [0, 0, 600, 32], bind: map_label, style: heading, align: center, valign: middle }
  - { type: text, box: [636, 0, 580, 32], bind: actions_label, style: heading, align: center, valign: middle }
  # 左栏：白底细框里的能力沙盘（外框由组件画），图例画在框外左下
  - type: component
    component: capability-map
    box: [0, 36, 600, 524]
    bind: map
    props: { frame: line, group_fill: surface_light, outline: line, title_color: text, item_style: body, fills: [bg, highlight_blue], legend_look: box }
  # 右栏：白底细框里的关键举措，各小节的标题和举措在一个文本框里自然往下排
  - { type: shape, box: [636, 36, 580, 492], fill: bg, line: line }
  - { type: bullets, box: [652, 48, 548, 468], bind: actions, children: points, style: body, group_style: emphasis }
  # 右下注释
  - { type: text, box: [636, 534, 580, 26], bind: note, style: lead, valign: middle, when: note }

guidance:
  - 左栏的层次从上到下按「靠近业务 → 靠近硬件」排，组名和右栏小节标题用同一套说法
  - 能力条目写名词短语（建什么），举措写动作（怎么建 + 产出什么），不要两边写成同一句话
  - 浅蓝底只给远期预埋的能力，近期落地的保持白底；两种都没有时可以不写 legend
