title: 标题：面向哪一块业务的整体策略
map_label: 左栏栏目名
actions_label: 右栏栏目名
map:
  title: 总标题：这几层能力怎么联合成一个整体
  groups:
    - name: 第一层的名称
      items:
        - { name: 第一层的能力（一） }
        - { name: 第一层的能力（二） }
        - { name: 第一层的能力（三） }
        - { name: 贯穿这一层的能力（占满一行）, wide: true }
    - name: 第二层的名称
      items:
        - name: 分组框名称：子方向
          columns: 2
          items:
            - { name: 子方向下的能力（一） }
            - { name: 子方向下的能力（二） }
            - { name: 子方向下的能力（三）, tag: 远期 }
            - { name: 子方向下的能力（四） }
        - { name: 第二层的能力（一） }
        - { name: 第二层的能力（二）, tag: 远期 }
        - { name: 第二层的能力（三） }
    - name: 第三层的名称
      items:
        - { name: 第三层的能力（一）, tag: 远期 }
        - { name: 第三层的能力（二）, tag: 远期 }
        - { name: 第三层的能力（三）, tag: 远期 }
        - { name: 第三层的能力（四）, tag: 远期 }
  legend:
    - { tag: 近期, label: 近期要落地的能力 }
    - { tag: 远期, label: 远期要预埋的能力 }
actions:
  - name: 第一层的名称
    points:
      - { name: 举措名称, text: 怎么做：用什么手段补上哪项能力，覆盖哪些场景和对象，做到什么程度、交付给谁用 }
      - { name: 举措名称, text: 怎么做：搭什么工具或平台，最后把哪件事查清楚 }
  - name: 第二层的名称
    points:
      - { name: 举措名称, text: 怎么做：在什么约束下分析哪件事，改善哪个指标，最后给出什么做法或时机 }
      - { name: 举措名称, text: 怎么做：理清哪两件事之间的对应关系，最后给出什么做法，能避免哪一类问题 }
      - { name: 举措名称, text: 怎么做：把哪几个指标放在一起分析，最后分别给出哪几类做法，用在什么环节 }
      - { name: 举措名称, text: 怎么做：分析哪几者之间怎么相互影响，最终得出什么样的协同做法 }
  - name: 第三层的名称
    points:
      - { name: 举措名称, text: 怎么做：针对哪一部分做分析，比较哪几种选择，最后给出什么样的配置建议 }
      - { name: 举措名称, text: 怎么做：分析哪几者之间的关系，划清哪一类能力的上限 }
      - { name: 举措名称, text: 怎么做：算清哪件事的收益和代价，看它随什么变化，最后得出哪一类调整做法 }
      - { name: 举措名称, text: 怎么做：分析哪一类任务该放在哪里做，得出什么样的最优做法 }
note: 一句注释：交代两栏的口径或分工，如某类工作归在哪一层
