insights:
  - 训练存储在互联网和运营商两类客户已规模商用，是当前收入的主要来源
  - 推理缓存只有 5 家试点，随着长上下文推理上量，这是未来两年最大的增量机会
  - 医疗客户训练和推理几乎空白，科研客户缺推理缓存，需联合行业伙伴打包方案进入
