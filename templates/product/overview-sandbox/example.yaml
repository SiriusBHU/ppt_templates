title: 智算存储业务沙盘
title_suffix: 客户与产品覆盖现状
takeaway: 训练存储已覆盖主要大客户，推理缓存和数据湖仍是空白较多的增长点
matrix:
  columns: [客户 / 场景, 训练存储, 推理缓存, 数据湖存储, 备份归档]
  rows:
    - [互联网大模型训练, 已商用 · 8 家, 试点中 · 3 家, 已商用 · 5 家, 规划中]
    - [运营商智算中心, 已商用 · 12 家, 规划中, 试点中 · 4 家, 已商用 · 6 家]
    - [金融行业私有云, 试点中 · 5 家, 试点中 · 2 家, 已商用 · 9 家, 已商用 · 14 家]
    - [科研与超算中心, 已商用 · 6 家, —, 试点中 · 3 家, 规划中]
    - [自动驾驶研发, 试点中 · 4 家, 规划中, 已商用 · 7 家, —]
    - [医疗影像与生物计算, 规划中, —, 试点中 · 2 家, 已商用 · 5 家]
