title: 存储方案对比
title_suffix: 面向千卡训练集群
takeaway: 近计算缓存方案在检查点写入和元数据延迟上全面领先，单节点成本仅增加8%
matrix:
  columns: [指标, 本地 NVMe, 并行文件系统, 对象存储, 近计算缓存]
  highlight_column: 4
  rows:
    - [顺序读带宽（单节点）, 12 GB/s, 6 GB/s, 2 GB/s, 14 GB/s]
    - [随机读 IOPS, 150万, 40万, 5万, 120万]
    - [检查点写入耗时, 32 秒, 95 秒, 210 秒, 11 秒]
    - [元数据操作延迟, 0.1 ms, 2 ms, 30 ms, 0.3 ms]
    - [容量扩展上限, 单机 30 TB, 100 PB, 无上限, 100 PB]
    - [单节点成本增量, 基准, +35%, +5%, +8%]
    - [故障后数据可恢复, 否, 是, 是, 是]
note: 测试环境为256节点、每节点8卡，模型规模175B，检查点大小2.1 TB；数据取三次运行的中位数，成本含硬件和软件授权
