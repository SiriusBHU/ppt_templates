title: 申请扩容资源
title_suffix: 支撑下一代大模型训练
takeaway: 新增512节点训练集群和专项预算，保证千亿模型按期完成训练
context:
  - 现有集群利用率连续三个月超过92%，任务排队等待时间已从2天增加到9天，在研项目被迫延期
  - 下一代千亿参数模型训练需要4000张加速卡，现有集群规模只能满足一半，无法按期启动训练
  - 检查点写入占训练时间的12%，不扩容存储会拖慢所有在研任务，新集群上线后损耗将翻倍
asks:
  - item: 批准新增512节点训练集群
    detail: 每节点8卡，共4096张加速卡，配套400G RDMA 网络和两级交换架构；预计2026年12月交付并上线，2027年1月起承接训练任务
  - item: 追加存储专项预算
    detail: 采购近计算缓存 NVMe 盘和 CXL 内存池，预算1800万元，用于消除检查点写入瓶颈，使写入损耗降到训练时间的3%以内
  - item: 抽调12名工程师参与联合攻关
    detail: 平台、网络、存储三个团队各抽调4人，为期6个月，负责集群调优和故障自愈
deadline: 2026年10月23日前；晚于该日期，集群交付将推迟到2027年一季度
