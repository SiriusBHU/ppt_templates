title: 关键测试结果
title_suffix: 512节点集群实测
takeaway: 检查点写入带宽提升至3.2倍，训练中断恢复时间缩短70%
kpis:
  - { value: 3.2×, label: 检查点写入带宽, note: 对比上一代方案，512节点并发写入 }
  - { value: 70%, label: 中断恢复时间缩短, note: 从18分钟降到5分钟，千亿参数模型 }
  - { value: 60%, label: 单次写入量减少, note: 增量检查点，相对全量保存 }
  - { value: 99.99%, label: 全年可用性, note: 连续90天压测，无数据丢失 }
notes:
  - 近计算缓存把检查点先写入计算节点本地 NVMe，再异步下刷到存储集群，写入路径不再经过网络，带宽接近本地盘上限，训练迭代不再被检查点阻塞，同步等待时间降为零
  - 增量检查点只保存相对上一版本变化的张量分片，单次写入量减少60%，同时显著降低了后端存储集群的容量压力和下刷带宽，三副本带来的写放大开销也随之下降
  - 恢复时间缩短来自两方面，一是本地缓存命中后直接加载检查点，二是 CXL 共享元数据去掉了跨节点的元数据查询，千亿参数模型的恢复时间从18分钟降到5分钟
  - 可用性数据来自连续90天的故障注入压测，覆盖节点宕机、网络抖动和单盘故障三类场景，期间未发生数据丢失，也没有触发训练任务整体重启，满足生产要求
