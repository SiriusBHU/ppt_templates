title: 项目风险与应对
title_suffix: 检查点加速方案
takeaway: 当前有2项高风险，均已有应对措施，预计11月底前全部关闭
risks:
  - risk: CXL 内存池交付延期，影响集群上线
    level: 高
    mitigation: 同步启动第二供应商认证，10月底前完成样品测试；首批订单分两期交付，先保证256节点
    owner: 采购部 王磊
  - risk: 近计算缓存在千卡规模下元数据热点
    level: 高
    mitigation: 引入元数据分片和热点迁移，11月15日前完成千卡压测，目标延迟低于1毫秒，并输出调优报告
    owner: 存储组 李敏
  - risk: 增量检查点与现有训练框架兼容性不足
    level: 中
    mitigation: 提供框架插件并适配 PyTorch 和 MindSpore 两个主流版本，10月底前完成全量回归测试并发布
    owner: 平台组 陈静
  - risk: 400G RDMA 网络在大规模并发写入时丢包，导致检查点变慢
    level: 中
    mitigation: 启用拥塞控制和 PFC 优化，联合网络组在测试集群复现并验证，11月上旬给出结论和改造建议
    owner: 网络组 赵强
  - risk: 新旧存储并行运行期间数据迁移耗时过长
    level: 低
    mitigation: 采用在线分批迁移，夜间低峰执行，预计耗时3周，对在研训练任务无影响
    owner: 运维组 周凯
