title: 总结
title_suffix: 方案达到预期目标
takeaway: 近计算缓存方案在带宽、恢复时间和写入量三方面全部达标
points:
  - { text: 万卡规模训练下，检查点同步写入阻塞训练迭代，是当前存储系统最大的瓶颈，每次中断损失约18分钟, level: 0 }
  - { text: 近计算缓存先写计算节点本地 NVMe 再异步下刷到存储集群，写入路径不再经过网络, level: 0 }
  - { text: 增量检查点只保存相对上一版本变化的张量分片，单次写入数据量减少60%, level: 1 }
  - { text: 512节点实测检查点写入带宽提升至3.2倍，训练中断恢复时间由18分钟缩短至5分钟, level: 0 }
  - { text: 热点元数据放入 CXL 内存池后，跨节点访问延迟从50μs降到5μs，元数据服务不再成为热点, level: 0 }
  - { text: 方案兼容现有 POSIX 和 S3 接口，训练框架无需改动代码即可接入, level: 0 }
conclusion: 建议2026年第四季度在万卡集群完成全量灰度上线，同步启动下一代 CXL 内存池预研，并在2027年第一季度前把检查点加速能力推广到全部训练集群
