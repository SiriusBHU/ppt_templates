title: 总结
title_suffix: 方案达到预期目标
takeaway: 近计算缓存方案在带宽、恢复时间和写入量三方面全部达标
points:
  - name: 检查点写入是最大瓶颈
    detail: 万卡规模训练下，检查点同步写入阻塞训练迭代，每次中断损失约18分钟
  - name: 近计算缓存去掉网络开销
    detail: 先写计算节点本地 NVMe 再异步下刷到存储集群，写入路径不再经过网络
  - name: 增量检查点减少写入量
    detail: 只保存相对上一版本变化的张量分片，单次写入数据量减少60%
  - name: 实测带宽与恢复时间达标
    detail: 512节点实测写入带宽提升至3.2倍，训练中断恢复时间由18分钟缩短至5分钟
  - name: CXL 内存池消除元数据热点
    detail: 热点元数据放入 CXL 内存池后，跨节点访问延迟从50μs降到5μs
  - name: 兼容现有接口，零改造接入
    detail: 兼容现有 POSIX 和 S3 接口，训练框架无需改动代码即可接入
conclusion: 建议2026年第四季度在万卡集群完成全量灰度上线，同步启动下一代 CXL 内存池预研，并在2027年第一季度前把检查点加速能力推广到全部训练集群
