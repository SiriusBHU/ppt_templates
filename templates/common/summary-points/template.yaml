id: common.summary-points
name: 要点总结
roles: [summary]
density: talk
tags: [总结, 结论, 要点]
when_to_use: 汇报结尾或一个部分结束时，用几条要点加一句结论收束
when_not_to_use: 要突出几个关键数字 → common.summary-kpi；要提出决策或资源诉求 → common.ask-decision
frame: standard

slots:
  type: object
  required: [title, points, conclusion]
  properties:
    title:
      type: string
      maxLength: 14
      description: 标题主体（24 号加粗），如「总结」
    title_suffix:
      type: string
      maxLength: 16
      description: 与标题同一行的后半句（18 号）
    takeaway:
      type: string
      maxLength: 40
      description: 副标题，一句话概括总结的主线
    points:
      type: array
      minItems: 3
      maxItems: 6
      description: 要点卡片，每行一条：左侧是要点结论，右侧是依据
      items:
        type: object
        required: [name, detail]
        properties:
          name: { type: string, maxLength: 16, description: 要点结论，一个短语，如「写入带宽提升3.2倍」 }
          detail: { type: string, maxLength: 70, description: 支撑这条结论的依据，最好带数字或条件 }
    conclusion:
      type: string
      maxLength: 90
      description: 一句结论或建议（不超过两行），放在页面底部的高亮横条里

layout:                         # 参考 body 区 1216×560
  # 上：要点卡片，每条一行，行高随条数均分
  - type: grid
    box: [0, 0, 1216, 432]
    bind: points
    columns: 1
    gap: 10
    item:
      - { type: shape, box: [0, 0, "100%", "100%"], fill: surface }
      - { type: shape, box: [0, 0, 4, "100%"], fill: accent }
      - { type: text, box: [28, 0, 300, "100%"], bind: name, style: emphasis, color: primary, valign: middle }
      - { type: shape, box: [348, 12, 1, "100%-24"], fill: line }
      - { type: text, box: [372, 0, "100%-396", "100%"], bind: detail, style: body, valign: middle }

  # 下：结论横条
  - { type: shape, box: [0, 456, 1216, 104], fill: highlight }
  - { type: shape, box: [0, 456, 4, 104], fill: highlight_strong }
  - { type: text, box: [28, 456, 96, 104], value: 核心结论, style: emphasis, color: highlight_strong, valign: middle }
  - { type: text, box: [144, 456, 1048, 104], bind: conclusion, style: emphasis, valign: middle }

guidance:
  - 要点按重要性排序，name 写结论、detail 写依据，最好带数字
  - 要点之间并列、互不包含；有层级关系的内容拆成两页或合并成一条
  - 结论回答「所以我们建议怎么做」，不要重复要点
