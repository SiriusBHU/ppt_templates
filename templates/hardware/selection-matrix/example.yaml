title: 检查点存储介质选型
title_suffix: 三种候选方案对比
takeaway: CXL 内存池恢复最快、写入带宽最高，综合最适合千卡训练
matrix:
  columns: [评估维度, 本地 NVMe, 并行文件系统, CXL 内存池]
  highlight_column: 3
  rows:
    - [写入带宽, 6.4GB/s 每节点, 2.1GB/s 每节点, 38GB/s 每节点]
    - [恢复时间, 180秒, 420秒, 55秒]
    - [可靠性, 节点故障丢数据, 三副本, 跨节点纠删码]
    - [容量成本, 低, 中, 较高]
    - [改造工作量, 小, 无, 中等]
recommendation:
  choice: CXL 内存池
  reasons:
    - 写入带宽是本地 NVMe 的6倍，检查点停顿从180秒降到30秒
    - 恢复时间只需55秒，比并行文件系统缩短87%，中断后更快继续训练
    - 跨节点纠删码保证单节点故障不丢数据，成本增加可控制在15%以内
