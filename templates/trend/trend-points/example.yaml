title: AI 训练基础设施趋势
title_suffix: 四大变化正在重塑集群设计
takeaway: 规模、互连、稀疏化和推理同时升级，存储要从容量型转向带宽与时延型
trends:
  - name: 集群规模跃升
    evidence: 头部训练集群从万卡扩展到十万卡，单集群功耗突破100MW，规模每翻一倍，日均故障次数同步翻倍，训练中断成为常态
    impact: 检查点写入的频率和容量成倍增加，必须把中断恢复时间压到分钟级，否则有效训练时间持续下降
  - name: 互连带宽翻倍
    evidence: 单卡互连带宽每代翻倍，800G 网卡已规模商用，1.6T 方案在2026年完成样机验证，网络先于存储成为瓶颈
    impact: 存储前端网络需要同步升级到 800G，并支持 GPU 直通访问存储，否则存储带宽无法跟上
  - name: 模型走向稀疏化
    evidence: MoE 成为万亿参数模型的主流结构，每次推理只激活约5%的参数，专家并行带来大量小粒度、突发的跨节点通信
    impact: 小 IO 和突发读写占比上升，需要同步优化小文件与元数据性能，避免尾延迟拖慢整体训练
  - name: 推理负载占比上升
    evidence: 长上下文和智能体场景让 KV Cache 容量需求增长10倍以上，推理已占 AI 总算力开销的一半以上
    impact: 需要把 KV Cache 下沉到共享存储，形成显存、内存、SSD 三级缓存，降低推理的重复计算
