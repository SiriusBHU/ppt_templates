title: 标题：一句话结论，写清用什么方案解决什么问题、拿到多少收益
problems_label: 问题标签
problems:
  - name: 第一个问题名称
    aspect: 问题落在哪个具体方面
    summary: 一句话总结：在什么场景下出现、由什么引起，造成多大的代价
  - name: 第二个问题名称
    aspect: 问题落在哪个具体方面
    summary: 一句话总结：在什么场景下出现、为什么现有做法不够，代价有多大
    width: 1.6
solutions:
  - name: 第一个方案的名称
    metrics:
      columns: [指标, 之前, 之后, 来源]
      widths: [3, 2.5, 2.5, 1.6]
      rows:
        - [指标名称，含单位, 改进前的数值, 改进后的数值, 测试口径]
        - [指标名称，含单位, 改进前的数值, 改进后的数值, 测试口径]
        - [指标名称，含单位, 改进前的数值, 改进后的数值, 测试口径]
    points:
      - { name: 设计要点一, text: 怎么做：用什么手段处理哪一部分，换掉了原来的哪一种做法，适用于什么场景，, highlight: 带来的关键收益是什么 }
      - { name: 设计要点二, text: 怎么做：跳过或合并了哪些工作，让开销不再随什么增长，, highlight: 省下多少开销 }
      - { name: 设计要点三, text: 怎么做：换成什么信息来源来判断，比原来的近似做法好在哪里、准多少 }
  - name: 第二个方案的名称
    metrics:
      columns: [指标, 结果, 来源]
      widths: [3, 4, 2]
      rows:
        - [指标名称，含单位, 结果数值与变化幅度, 测试口径]
        - [指标名称，含单位, 结果数值与变化幅度, 测试口径]
        - [指标名称，含单位, 结果数值与变化幅度, 测试口径]
    points:
      - { name: 设计要点一, text: 怎么做：用什么反馈或控制方式，让哪个指标稳定在目标附近、不来回抖动，, highlight: 带来的关键收益 }
      - { name: 设计要点二, text: 怎么做：作用在多细的粒度上，兼顾了哪几类对象各自的诉求，还支撑哪种分层 }
      - { name: 设计要点三, text: 怎么做：把哪件事提前或推后做，躲开了什么时刻的什么问题，不影响哪类需求 }
