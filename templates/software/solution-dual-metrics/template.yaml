id: software.solution-dual-metrics
name: 问题与方案对照（示意图 + 指标表 + 设计要点）
roles: [solution, problem, result]
also_fits: [system, hardware]
density: talk
level: subsystem
tags: [问题方案对照, 机制示意图, 指标表, 设计要点, 收益]
when_to_use: 一页讲清一两个核心问题和各自的解法：顶部虚线框里列问题（问题名 + 所在方面 + 一句话总结），下方每个方案一栏，配机制示意图、前后指标表和设计要点
when_not_to_use: 只有一个方案、要讲模块处理流程 → software.solution-module-flow；只列痛点不讲方案 → software.problem-pain-points；只讲改进前后的指标 → software.result-before-after
frame: standard

structure:
  - 标题：结论式，一句话写清用什么方案、解决什么问题、带来多少收益（可以带最突出的数字）
  - 顶部虚线框：把这一页要解决的问题圈在一起；框内左侧的红字（如「核心问题」）点明这一带的角色
  - 每个问题：红字问题名写在细框上方，点出症结；细框里先写问题落在哪个具体方面，再用一句话总结现象和代价
  - 下方各栏：每栏一个方案，和上方的问题一一对应、顺序相同；压在栏框顶边上的蓝字是方案名
  - 每栏自上而下：机制示意图（改进前后的对比）→ 指标表（指标 / 之前 / 之后 / 来源，或指标 / 结果 / 来源；白底只画横线）→ 两三条设计要点「要点名：做法」，最关键的收益用蓝色加粗强调
  - 上半页讲「为什么要做」，下半页讲「怎么做、效果多少」，指标表里的数字要能在要点里找到出处

slots:
  type: object
  required: [title, problems_label, problems, solutions]
  properties:
    title:
      type: string
      maxLength: 40
      description: 页标题（24 号加粗、深红、一行）：结论句，写清方案、对象和最突出的收益；中文不超过 36 个字（英文、数字约半个字宽）
    problems_label:
      type: string
      maxLength: 4
      description: 问题带左侧的红字标签，两个字一行，如「核心问题」
    problems:
      type: array
      minItems: 1
      maxItems: 2
      description: 要解决的问题，从左到右，和下方的方案一一对应
      items:
        type: object
        required: [name, aspect, summary]
        properties:
          name: { type: string, maxLength: 12, description: 问题名（18 号加粗、深红，写在细框上方），点出症结 }
          aspect: { type: string, maxLength: 16, description: 问题落在哪个具体方面（14 号加粗、居中） }
          summary: { type: string, maxLength: 40, description: 一句话总结：在什么场景下出现、代价多大（14 号加粗，最多两行） }
          width: { type: number, minimum: 1, maximum: 2, description: 这个问题框的相对宽度，默认 1；话多的设 1.5 }
    solutions:
      type: array
      minItems: 1
      maxItems: 2
      description: 方案，从左到右，和上方的问题一一对应、顺序相同
      items:
        type: object
        required: [name, metrics, points]
        properties:
          name: { type: string, maxLength: 14, description: 方案名（18 号加粗、蓝色，压在栏框顶边上） }
          diagram: { type: string, description: 机制示意图的图片路径（改进前后对比），没有就留空显示占位框 }
          metrics:
            type: object
            description: 指标表（table 组件）：columns 是表头（如 指标 / 之前 / 之后 / 来源，或 指标 / 结果 / 来源），rows 每行一个指标，三四行；widths 按各列内容长短给相对宽度，让每格一行写完
          points:
            type: array
            minItems: 1
            maxItems: 3
            description: 设计要点，每条「要点名：做法」，最关键的收益写进 highlight（蓝色加粗，接在做法后面）
            items:
              type: object
              required: [name, text]
              properties:
                name: { type: string, maxLength: 18, description: 要点名（加粗，自动接「：」；中文不超过 10 个字，英文、数字约半个字宽） }
                text: { type: string, maxLength: 36, description: 做法 }
                highlight: { type: string, maxLength: 16, description: 最关键的收益，蓝色加粗；name + text + highlight 合起来不超过两行（约 56 字） }

layout:                         # 参考 body 区 1216×560（本页无 takeaway，正文区自动上移并纵向拉伸到 600）
  # 顶部：虚线框圈住全部问题，左侧红字标签
  - { type: shape, box: [0, 0, 1216, 136], fill: bg, line: muted, dash: true }
  - { type: text, box: [20, 18, 64, 100], bind: problems_label, style: heading, color: accent, align: center, valign: middle }
  - type: grid
    box: [116, 0, 1084, 130]
    bind: problems
    columns: 2
    gap: 38
    weight: width
    item:
      - { type: text, box: [0, 0, "100%", 36], bind: name, style: heading, color: accent, align: center, valign: middle }
      - { type: shape, box: [0, 40, "100%", "100%-40"], fill: bg, line: line }
      - { type: text, box: [12, 44, "100%-24", 24], bind: aspect, style: emphasis, align: center, valign: middle }
      - { type: text, box: [16, 70, "100%-32", "100%-74"], bind: summary, style: emphasis }
  # 下方：每个方案一栏，方案名压在栏框顶边上（白底遮住框线）
  - type: grid
    box: [0, 152, 1216, 408]
    bind: solutions
    columns: 2
    gap: 28
    item:
      - { type: shape, box: [0, 18, "100%", "100%-18"], fill: bg, line: line }
      - { type: shape, box: ["15%", 0, "70%", 36], fill: bg }
      - { type: text, box: ["15%", 0, "70%", 36], bind: name, style: heading, color: primary_text, align: center, valign: middle }
      - { type: image, box: [16, 44, "100%-32", 100], bind: diagram, placeholder: 机制示意图：改进前后的对比 }
      - type: component
        component: table
        box: [12, 152, "100%-24", 100]
        bind: metrics
        props: { look: plain, text_style: caption }
      - { type: bullets, box: [16, 264, "100%-32", "100%-268"], bind: points, style: lead }

guidance:
  - 问题和方案按同样的顺序左右排，读者一眼能对上；只有一个问题时也可以只放一栏
  - 一句话总结写现象和代价，不要提前写方案；方案名写「对什么做什么」
  - 指标表三四行，每行一个可检验的指标；之前 / 之后写具体数值或趋势，来源写测试口径
  - 设计要点每条一件事：要点名是做法的名字，text 写怎么做，highlight 写这一条带来的关键收益
