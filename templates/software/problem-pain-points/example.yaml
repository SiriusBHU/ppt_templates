title: 检查点实现问题
title_suffix: 三处缺陷拖慢训练
takeaway: 写入阻塞、元数据热点和串行恢复，合计浪费约15%的训练算力
points:
  - name: 检查点同步写入
    detail: 每次保存检查点，所有 GPU 都要停下来等待数据写入共享存储完成，万卡集群单次阻塞约180秒，期间训练吞吐归零，模型越大等待越久，运维只能拉长保存间隔，故障后回退的训练进度也随之增多
    impact: 损失算力8%
  - name: 元数据访问热点
    detail: 海量小文件的元数据请求集中落在少数几个节点上，并发线程越多排队越长，数据加载逐渐成为训练瓶颈，GPU 常因等数据而空转，单纯扩容存储节点也无法缓解，热点节点的 CPU 长期跑满
    impact: P99延迟50ms
  - name: 故障恢复串行
    detail: 节点故障后要从远端重新拉取完整检查点，再逐层重建训练状态，各步骤串行执行，无法与新节点的启动重叠，万卡训练每天约发生数次故障，每次都要重复整个流程，损失持续累积
    impact: 恢复25分钟
