title: 检查点加速方案
title_suffix: 引入近计算缓存
takeaway: 在数据服务层新增检查点加速与数据预取，训练中断恢复时间缩短70%
layers:
  - name: 接入层
    modules:
      - { name: 训练框架插件 }
      - { name: POSIX 客户端 }
      - { name: S3 网关 }
  - name: 数据服务层
    modules:
      - { name: 元数据服务 }
      - { name: 数据缓存 }
      - { name: 检查点加速, highlight: true }
      - { name: 数据预取, highlight: true }
  - name: 存储引擎层
    modules:
      - { name: 分布式日志 }
      - { name: 纠删码 }
      - { name: 冷热分层 }
      - { name: 快照与克隆 }
  - name: 硬件资源层
    modules:
      - { name: NVMe SSD }
      - { name: RDMA 网络 }
      - { name: CXL 内存池, highlight: true }
design_points:
  - name: 近计算缓存
    detail: 检查点先写入计算节点本地 NVMe，再异步下刷到存储集群，写入不阻塞训练
  - name: 增量检查点
    detail: 只保存相对上一版本变化的张量分片，单次写入数据量减少60%
  - name: CXL 共享元数据
    detail: 热点元数据放入 CXL 内存池，跨节点访问延迟从50μs降到5μs
benefits:
  - { value: 70%, label: 中断恢复时间缩短 }
  - { value: 3.2×, label: 检查点写入带宽 }
  - { value: 60%, label: 单次写入量减少 }
