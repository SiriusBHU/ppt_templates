title: 存储系统演进路线
title_suffix: 三年五个阶段
takeaway: 从单集群检查点加速起步，三年内演进为跨集群统一的 AI 数据底座
stages:
  - period: 2026年H1
    name: 检查点加速
    points:
      - 近计算缓存上线，写入不再阻塞训练进程
      - 增量检查点，单次写入量减少60%
      - 恢复时间缩短到60秒以内
  - period: 2026年H2
    name: 数据预取
    points:
      - 数据加载与计算流水并行
      - 训练数据缓存命中率提升到95%以上
      - 接入三个主流训练框架
  - period: 2027年H1
    name: 内存池化
    points:
      - 引入 CXL 共享内存池
      - 元数据访问延迟降低10倍
      - 单集群支撑1万张卡
  - period: 2027年H2
    name: 跨集群调度
    points:
      - 多集群数据统一命名空间
      - 热点数据按负载自动迁移
      - 跨地域数据复制的带宽利用率达90%
  - period: 2028年
    name: 智能数据底座
    points:
      - 按任务特征自动选择最优存储策略
      - 存储成本再降低40%
      - 形成可对外开放的数据服务
vision: 2028年建成跨集群、自适应的 AI 数据底座，训练有效算力利用率提升到95%
