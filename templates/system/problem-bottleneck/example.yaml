title: 检查点写入瓶颈
title_suffix: 拖慢千卡训练
takeaway: 检查点写入占用12%训练时长，主因是同步落盘和元数据热点
symptom: 千卡训练每30分钟写一次检查点，写入期间全部 GPU 停下等待，约3分钟后才恢复计算
metrics:
  - { value: 12%, label: 训练时长耗在检查点写入, note: 1024卡集群，7天任务统计 }
  - { value: 180秒, label: 单次检查点写入停顿, note: 万亿参数模型，每次2.4TB }
  - { value: 35%, label: 写入期间 GPU 空闲占比, note: 含元数据创建等待时间 }
causes:
  - name: 同步落盘阻塞训练
    detail: 检查点必须写到远端存储并确认后训练才继续，写入延迟直接计入训练时间
  - name: 元数据服务热点
    detail: 1024个进程同时创建文件，元数据节点 CPU 打满，创建延迟从2ms升到80ms
  - name: 全量写放大
    detail: 每次都写完整模型和优化器状态，其中约60%的张量分片与上一版本完全相同
  - name: 网络带宽争抢
    detail: 检查点流量与梯度同步共用 RDMA 网络，写入高峰期通信耗时增加约25%
