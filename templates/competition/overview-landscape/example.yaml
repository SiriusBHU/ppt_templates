title: AI 存储竞争格局
title_suffix: 六家主要玩家对比
takeaway: 并行文件系统与全闪统一存储两条路线并行，训练检查点场景尚无专项优化
players:
  - name: DDN
    position: 超算并行文件系统老牌厂商
    strength: 超算和大规模训练场景积累深，单集群聚合带宽高，头部客户案例多，交付经验成熟
    weakness: 云原生与多租户能力偏弱，软件授权和硬件深度绑定，客户议价空间小
  - name: WEKA
    position: 软件定义并行文件系统
    strength: 支持 GPU 直通访问，元数据性能强，跨云部署灵活，在 AI 新兴客户中口碑较好
    weakness: 依赖第三方硬件，整体方案交付和运维责任边界不清，软件授权价格偏高
  - name: VAST Data
    position: 全闪分层统一存储
    strength: 全闪架构单位容量成本低，数据服务丰富，在大型云厂商和 AI 新兴客户中落地快
    weakness: 小文件和元数据密集场景延迟偏高，缺少针对训练检查点的专项优化
  - name: Pure Storage
    position: 企业全闪 NAS 与对象存储
    strength: 企业客户基础广，产品稳定性好，订阅服务模式成熟，运维体验在业界领先
    weakness: 单集群扩展规模有限，缺少面向大模型训练的整体方案，高带宽场景成本偏高
  - name: NVIDIA
    position: 以 GPU 带动的整体参考架构
    strength: 掌握 GPU 与网络生态，参考架构直接定义了存储的接入方式，对合作伙伴有认证话语权
    weakness: 自身不做存储产品，依赖合作伙伴交付，客户定制空间小，存储部分利润让渡给伙伴
  - name: 国内厂商 A
    position: 面向智算中心的分布式存储
    strength: 本地化服务响应快，价格有竞争力，已进入多个智算中心项目，政企客户关系深
    weakness: 高端带宽和时延与头部差距明显，缺少千卡以上规模验证，软件生态和工具链不完善
insight: 对手普遍没有针对训练检查点的专项优化，这是我们在训练场景拉开差距的窗口
